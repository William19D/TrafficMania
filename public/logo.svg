<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620">
  <title>TrafficMania</title>
  <defs>
    <!-- low road: dives diagonally BEHIND the letters and under the overpass -->
    <path id="low" d="M150 -40 C 230 120, 330 170, 520 260 S 780 380, 900 470 S 1060 600, 1150 660"/>
    <!-- loop ramp: swings under the right end and round below the words -->
    <path id="loop" d="M930 326 C 1150 360, 1200 560, 1010 568 S 560 610, 300 570 S 70 470, -60 520"/>
    <!-- high road: an overpass weaving through the gap between the words, grazing both -->
    <path id="high" d="M-60 300 C 140 230, 260 340, 430 292 S 700 230, 820 300 S 1040 350, 1260 250"/>
    <g id="car"><g transform="translate(0 8.5)"><rect x="-12" y="-6.5" width="24" height="13" rx="4"/><rect x="4" y="-4.5" width="4.5" height="9" rx="1.2" fill="#fff" opacity=".75"/></g></g>
    <style>
      .edge { fill: none; stroke: #8F8B83; stroke-width: 44; stroke-linecap: round; }
      .deck { fill: none; stroke: #FFFFFF; stroke-width: 34; stroke-linecap: round; }
      .line { fill: none; stroke: #F2C14E; stroke-width: 3.5; stroke-dasharray: 14 11; stroke-linecap: round; }
      .word { font-family: Bahnschrift, 'DIN Alternate', 'Segoe UI', system-ui, sans-serif; font-weight: 800;
              paint-order: stroke; stroke-linejoin: round; }
      @media (prefers-reduced-motion: reduce) { .cars { display: none; } }
    </style>
  </defs>

  <!-- low road and its cars, under everything -->
  <use href="#low" class="edge"/><use href="#low" class="deck"/><use href="#low" class="line"/>
  <g class="cars">
    <!-- rotate=auto drives with the path, auto-reverse + keyPoints 1;0 drives against it; both keep right -->
    <use href="#car" fill="#E5484D"><animateMotion dur="6s" repeatCount="indefinite" rotate="auto"><mpath href="#low"/></animateMotion></use>
    <use href="#car" fill="#2E9E5B"><animateMotion dur="6s" begin="-3s" repeatCount="indefinite" rotate="auto"><mpath href="#low"/></animateMotion></use>
    <use href="#car" fill="#1E2A44"><animateMotion dur="6.4s" begin="-1.2s" repeatCount="indefinite" rotate="auto-reverse" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#low"/></animateMotion></use>
    <use href="#car" fill="#F2C14E"><animateMotion dur="6.4s" begin="-4.4s" repeatCount="indefinite" rotate="auto-reverse" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#low"/></animateMotion></use>
  </g>

  <use href="#loop" class="edge"/><use href="#loop" class="deck"/><use href="#loop" class="line"/>
  <g class="cars">
    <use href="#car" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.5"><animateMotion dur="6.5s" repeatCount="indefinite" rotate="auto"><mpath href="#loop"/></animateMotion></use>
    <use href="#car" fill="#2F6FED"><animateMotion dur="6.5s" begin="-3.3s" repeatCount="indefinite" rotate="auto"><mpath href="#loop"/></animateMotion></use>
    <use href="#car" fill="#E07B2E"><animateMotion dur="7s" begin="-1.8s" repeatCount="indefinite" rotate="auto-reverse" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#loop"/></animateMotion></use>
    <use href="#car" fill="#E5484D"><animateMotion dur="7s" begin="-5.2s" repeatCount="indefinite" rotate="auto-reverse" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#loop"/></animateMotion></use>
  </g>

  <!-- the words -->
  <text class="word" x="80" y="240" font-size="232" textLength="1040" lengthAdjust="spacingAndGlyphs"
        fill="#2B2B2B" stroke="#FFFFFF" stroke-width="14">TRAFFIC</text>
  <rect x="300" y="344" width="600" height="190" rx="38" fill="#2459C8"/>
  <rect x="300" y="330" width="600" height="190" rx="38" fill="#2F6FED"/>
  <text class="word" x="345" y="486" font-size="172" textLength="510" lengthAdjust="spacingAndGlyphs" fill="#FFFFFF">MANIA</text>

  <!-- high road: hard shadow, then the deck over everything -->
  <use href="#high" fill="none" stroke="rgba(30,30,40,.2)" stroke-width="44" stroke-linecap="round" transform="translate(0 14)"/>
  <use href="#high" class="edge"/><use href="#high" class="deck"/><use href="#high" class="line"/>
  <g class="cars">
    <use href="#car" fill="#F2C14E"><animateMotion dur="7s" repeatCount="indefinite" rotate="auto"><mpath href="#high"/></animateMotion></use>
    <use href="#car" fill="#E5484D"><animateMotion dur="7s" begin="-2.4s" repeatCount="indefinite" rotate="auto"><mpath href="#high"/></animateMotion></use>
    <use href="#car" fill="#1E2A44"><animateMotion dur="7s" begin="-4.8s" repeatCount="indefinite" rotate="auto"><mpath href="#high"/></animateMotion></use>
    <use href="#car" fill="#2F6FED"><animateMotion dur="7.6s" begin="-1.3s" repeatCount="indefinite" rotate="auto-reverse" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#high"/></animateMotion></use>
    <use href="#car" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.5"><animateMotion dur="7.6s" begin="-3.9s" repeatCount="indefinite" rotate="auto-reverse" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#high"/></animateMotion></use>
    <use href="#car" fill="#2E9E5B"><animateMotion dur="7.6s" begin="-6.4s" repeatCount="indefinite" rotate="auto-reverse" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#high"/></animateMotion></use>
  </g>
</svg>
