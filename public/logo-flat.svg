<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 300">
  <title>TrafficMania</title>
  <svg x="20" y="30" width="240" height="240" viewBox="0 0 512 512">
    <defs>
      <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
      <g id="roads">
        <rect x="216" y="-20" width="80" height="552"/>
        <rect x="-20" y="216" width="552" height="80"/>
        <circle cx="256" cy="256" r="130" fill="none" stroke-width="84"/>
      </g>
    </defs>
    <g clip-path="url(#tile)">
      <rect width="512" height="512" fill="#2F6FED"/>
      <!-- hard offset shadow, like the HUD -->
      <use href="#roads" fill="#2459C8" stroke="#2459C8" transform="translate(0 12)"/>
      <use href="#roads" fill="#FFFFFF" stroke="#FFFFFF"/>
      <!-- centre lines -->
      <g stroke="#F2C14E" stroke-width="9" stroke-linecap="round" stroke-dasharray="22 16" fill="none">
        <path d="M256 -10V126M256 386V522M-10 256H126M386 256H522"/>
        <circle cx="256" cy="256" r="130"/>
      </g>
      <!-- island -->
      <circle cx="256" cy="256" r="88" fill="#5FA845"/>
      <circle cx="256" cy="256" r="62" fill="#7CC25E"/>
      <circle cx="238" cy="240" r="18" fill="#5FA845"/>
      <circle cx="276" cy="266" r="14" fill="#5FA845"/>
      <!-- cars -->
      <g transform="rotate(-38 352 165)">
        <rect x="326" y="152" width="54" height="28" rx="8" fill="#E5484D"/>
        <rect x="362" y="156" width="9" height="20" rx="2" fill="#FFFFFF" opacity=".75"/>
      </g>
      <g transform="rotate(-90 236 452)">
        <rect x="210" y="438" width="54" height="28" rx="8" fill="#1E2A44"/>
        <rect x="246" y="442" width="9" height="20" rx="2" fill="#FFFFFF" opacity=".7"/>
      </g>
    </g>
  </svg>
  <!-- textLength pins the word widths so the pill fits whatever font renders it -->
  <g font-family="Bahnschrift, 'DIN Alternate', 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="140">
    <text x="296" y="202" textLength="520" lengthAdjust="spacingAndGlyphs" fill="#2B2B2B">TRAFFIC</text>
    <rect x="842" y="78" width="456" height="162" rx="30" fill="#2459C8"/>
    <rect x="842" y="66" width="456" height="162" rx="30" fill="#2F6FED"/>
    <text x="876" y="194" textLength="388" lengthAdjust="spacingAndGlyphs" fill="#FFFFFF">MANIA</text>
  </g>
</svg>
